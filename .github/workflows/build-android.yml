name: Build Android Engine

# =====================================================================
#  在 CI 上编译 Pikafish Android 共享库（libpikafish.so）。
#
#  好处：开发者本地无需安装 Android NDK，也不必手工组装插件目录，
#        直接下载产物即可用于 uni-app 云打包。
#
#  注意：CI 用 Linux runner（免费额度更省，且公开仓库不限量）。
#        NDK 由 setup-ndk action 提供，不依赖 runner 预装版本。
#
#  发布由 release.yml 统一聚合，本工作流只负责产出 artifact。
# =====================================================================

# 仅手动触发。
# workflow_call 保留：release.yml 靠它复用本工作流的编译作业，删了会断链。
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # Pikafish 官方要求 NDK r27+（低版本缺少必要的 C++17 支持）
      #
      # 不要开启 local-cache：它会在 ~/.setup-ndk 下建一个指向
      # /opt/hostedtoolcache 的软链接，缓存未命中时链接失效，
      # 于是路径看着存在、实际打不开，编译时报
      # "clang++: No such file or directory"（见 nttld/setup-ndk#547）。
      - name: 安装 Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # -------------------------------------------------------------
      #  定位工具链并做前置校验。
      #  不硬编码 action 的输出路径：该 action 历史上多次改变目录层级
      #  （见 setup-ndk#576），直接探测 clang++ 真实位置最稳妥，
      #  且失败会立刻停在这一步，而不是刷几十行编译错误。
      # -------------------------------------------------------------
      - name: 定位 NDK 工具链
        id: toolchain
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          echo "action 输出的 ndk-path: $NDK_PATH"

          CLANG=""
          for base in "$NDK_PATH" "$ANDROID_NDK_HOME" "$ANDROID_NDK_ROOT"; do
            [ -n "$base" ] || continue
            # 真实 NDK 目录可能还嵌一层 android-ndk-rXX
            for cand in "$base" "$base"/android-ndk-*; do
              c="$cand/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
              if [ -x "$c" ]; then CLANG="$c"; break 2; fi
            done
          done

          if [ -z "$CLANG" ]; then
            echo "::error::未能定位可执行的 clang++"
            echo "--- 诊断信息 ---"
            ls -la "$NDK_PATH" 2>&1 || echo "ndk-path 不可读"
            find /opt/hostedtoolcache/ndk ~/.setup-ndk -maxdepth 3 -name 'clang++' 2>/dev/null | head -20
            exit 1
          fi

          BIN="$(dirname "$CLANG")"
          echo "clang     = $CLANG"
          echo "版本      = $("$CLANG" --version | head -1)"
          echo "clang=$CLANG"                >> "$GITHUB_OUTPUT"
          echo "readelf=$BIN/llvm-readelf"    >> "$GITHUB_OUTPUT"

      - name: 拉取 Pikafish 源码
        run: |
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git engine-src
          echo "源码文件数: $(find engine-src/src -name '*.cpp' | wc -l)"

      # ---------------------------------------------------------------
      #  编译。这里直接用 clang++ 而非项目里的 PowerShell 脚本，
      #  因为 runner 是 Linux；编译参数与 build_so.ps1 严格保持一致。
      # ---------------------------------------------------------------
      - name: 编译 libpikafish.so
        env:
          CLANG: ${{ steps.toolchain.outputs.clang }}
          ABI: ${{ matrix.abi }}
        run: |
          set -e

          # 目标三元组与架构专属参数
          if [ "$ABI" = "arm64-v8a" ]; then
            TARGET="aarch64-linux-android21"
            ARCH_FLAGS="-DUSE_NEON=8 -DUSE_POPCNT"
          else
            TARGET="x86_64-linux-android21"
            # x86_64 需禁用 zstd 汇编，否则 .S 文件不参与构建会报错
            ARCH_FLAGS="-DUSE_SSE41 -DUSE_SSSE3 -DUSE_SSE2 -DUSE_POPCNT -mpopcnt -msse4.1 -DZSTD_DISABLE_ASM=1"
          fi

          # -DIS_64BIT 必需：象棋 90 格棋盘需要 unsigned __int128
          COMMON="-std=c++17 -O3 -DNDEBUG -DIS_64BIT -DNNUE_EMBEDDING_OFF -fPIC -fno-rtti -fvisibility=hidden"

          mkdir -p build/$ABI obj
          SOURCES=$(find engine-src/src -name '*.cpp' ! -name 'main.cpp')
          SOURCES="$SOURCES native/android/jni/engine_main.cpp native/android/jni/pikafish_jni.cpp"

          echo "==> compiling for $ABI ($TARGET)"
          i=0
          for f in $SOURCES; do
            i=$((i+1))
            base=$(basename "$f" .cpp)
            $CLANG --target=$TARGET $COMMON $ARCH_FLAGS \
              -Iengine-src/src -Iengine-src/src/external \
              -c "$f" -o "obj/${i}_${base}.o" &
            while [ "$(jobs -r | wc -l)" -ge "$(nproc)" ]; do sleep 0.1; done
          done
          wait

          echo "==> linking"
          $CLANG --target=$TARGET -shared -o build/$ABI/libpikafish.so \
            obj/*.o -llog -static-libstdc++ -Wl,--gc-sections -s

          ls -lh build/$ABI/libpikafish.so

      # ---------------------------------------------------------------
      #  校验：ELF 架构正确 + JNI 符号完整导出
      #  （符号漏导出是最隐蔽的坑，运行时才报 UnsatisfiedLinkError）
      # ---------------------------------------------------------------
      - name: 校验产物
        env:
          READELF: ${{ steps.toolchain.outputs.readelf }}
          ABI: ${{ matrix.abi }}
        run: |
          set -e
          SO="build/$ABI/libpikafish.so"

          echo "=== ELF 头 ==="
          $READELF -h "$SO" | grep -E 'Class|Machine|Type'

          echo ""
          echo "=== JNI 符号检查 ==="
          MISSING=0
          for sym in \
            Java_com_xiangqi_engine_PikafishBridge_nativeInit \
            Java_com_xiangqi_engine_PikafishBridge_nativeSend \
            Java_com_xiangqi_engine_PikafishBridge_nativeReadLine \
            pikafish_main
          do
            if $READELF --dyn-syms "$SO" | grep -q "$sym"; then
              echo "  OK      $sym"
            else
              echo "  MISSING $sym"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || { echo "符号导出不完整，构建失败"; exit 1; }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: libpikafish-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/libpikafish.so
          retention-days: 30

  # -----------------------------------------------------------------
  #  把两个 ABI 的产物 + 权重 + Java 源码打成可直接使用的插件包
  # -----------------------------------------------------------------
  package-plugin:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载所有 ABI 产物
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      # Java 源码只在 HBuilderX 云打包阶段才编译，本地与 CI 都不检查，
      # 曾因误用 fastjson 不存在的 optString(key, fallback) 导致插件类
      # 编译失败、requireNativePlugin 返回 null，真机上只提示
      # 「原生插件未加载」，排查成本极高。这里用桩类 + javac 提前拦住。
      - name: 校验 Java 源码可编译
        run: node scripts/check-android-plugin.cjs

      # ---------------------------------------------------------------
      #  把 Java 编译成 jar。
      #
      #  【为什么必须编译】官方插件包格式规定 integrateType 只能取
      #  aar 或 jar，含义是「原生导出的文件类型」——云打包只会引用
      #  已编译产物，【不会】帮你编译 android/src 下的 .java 源码。
      #  此前插件包里只有裸 .java，类根本没进 APK，于是
      #  requireNativePlugin('XiangqiEngine') 恒为 null，
      #  App 一直提示「原生插件未加载」。iOS 侧因为给的是编译好的
      #  framework 所以正常，两端差异正是由此而来。
      #
      #  【桩类绝不能进 jar】桩类只是为了满足编译期符号（真实实现由
      #  DCloud 的 uniapp-v8-release.aar 在运行时提供）。若把
      #  io/dcloud、com/alibaba、android/ 这些桩类打进 jar，运行时会
      #  与真实类冲突甚至覆盖，故障比现在更隐蔽。所以编译时用桩类，
      #  打包时只取 com/xiangqi，并在下面做硬断言。
      # ---------------------------------------------------------------
      - name: 编译 Java 为 jar
        run: |
          set -e
          mkdir -p jarbuild/classes

          find native/android/stubs native/android/java -name '*.java' > sources.txt
          echo "参与编译的源文件："
          sed 's/^/    /' sources.txt

          # --release 8：与云打包 JDK 1.8 字节码版本保持一致
          javac --release 8 -encoding UTF-8 -nowarn -d jarbuild/classes @sources.txt

          # 只打包自己的类，桩类留在 classes 目录里不带走
          (cd jarbuild/classes && jar cf ../xiangqi-engine.jar com/xiangqi)

          echo ""
          echo "=== jar 内容 ==="
          jar tf jarbuild/xiangqi-engine.jar

          echo ""
          echo "=== 断言 ==="
          FAIL=0

          for cls in \
            com/xiangqi/engine/XiangqiEngineModule.class \
            com/xiangqi/engine/PikafishBridge.class
          do
            if jar tf jarbuild/xiangqi-engine.jar | grep -qx "$cls"; then
              echo "  OK       含 $cls"
            else
              echo "  MISSING  缺 $cls"
              FAIL=1
            fi
          done

          # 桩类混入是严重问题，必须拦死
          for bad in io/dcloud com/alibaba android/; do
            if jar tf jarbuild/xiangqi-engine.jar | grep -q "^$bad"; then
              echo "  BAD      jar 内混入桩类 $bad（会覆盖真实 SDK 类）"
              FAIL=1
            else
              echo "  OK       无桩类 $bad"
            fi
          done

          [ "$FAIL" -eq 0 ] || { echo '::error::jar 内容不符合预期'; exit 1; }
          ls -lh jarbuild/xiangqi-engine.jar

      # 注意：不再把 NNUE 权重打进插件包。
      # 官方权重 2026-07 已涨到约 49MB，打进去后插件包约 102MB，
      # 远超 HBuilderX 云打包 40MB 免费额度；且官方会持续更新权重。
      # 现改为 App 首次启动时下载到本地（见 app/utils/nnue.js）。

      - name: 组装插件目录
        run: |
          set -e
          # 目录名必须与 package.json 的 id 一致，否则 HBuilderX 识别不到插件
          P="XiangqiEngine"

          # 【so 放置位置】官方规定（nativesupport.dcloud.net.cn 插件包格式）：
          #   "android\libs 目录，所有需要使用的 jar 文件放到此目录，
          #    如果包含 so 文件，则放到 libs 下对应 cpu 类型目录"
          # 之前用的 src/main/jniLibs/ 是 Android Gradle 工程的约定，
          # 不是 uni-app 插件包的约定，云打包不会去那里找 .so。
          mkdir -p $P/android/libs/arm64-v8a
          mkdir -p $P/android/libs/x86_64

          cp downloaded/libpikafish-arm64-v8a/libpikafish.so $P/android/libs/arm64-v8a/
          cp downloaded/libpikafish-x86_64/libpikafish.so    $P/android/libs/x86_64/

          # 【jar 而非 .java】云打包不编译源码，只引用 libs 下的 jar。
          # 不再拷贝 src/main/java：那份源码从来没被云打包用到，
          # 留着只会让人误以为它生效了（本次故障的根源就在这里）。
          cp jarbuild/xiangqi-engine.jar                      $P/android/libs/
          cp app/nativeplugins/XiangqiEngine/package.json     $P/

          echo "=== 插件目录结构 ==="
          find $P -type f | sort
          echo ""
          echo "=== 体积统计（云打包免费额度 40MB）==="
          du -sh $P
          echo "完整包（含 x86_64 调试库）: $(du -sm $P | cut -f1)MB"

          # 另出一份正式发布包：去掉模拟器库，体积腰斩。
          # 用 staging 子目录承载，保证解压后顶层目录仍叫 XiangqiEngine，
          # 否则使用者需要手工改名才能被 HBuilderX 识别。
          mkdir -p staging-release
          cp -R $P staging-release/$P
          rm -rf staging-release/$P/android/libs/x86_64
          echo "正式包（仅 arm64）: $(du -sm staging-release/$P | cut -f1)MB"

          zip -qry XiangqiEngine-android-full.zip $P
          (cd staging-release && zip -qry ../XiangqiEngine-android-release.zip $P)

      - name: 上传插件包
        uses: actions/upload-artifact@v4
        with:
          name: XiangqiEngine-plugin-android
          path: XiangqiEngine-android-*.zip
          retention-days: 30
